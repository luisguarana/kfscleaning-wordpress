<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef3f5;font-family:'Public Sans',system-ui,sans-serif;color:#15303a;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

input:focus,textarea:focus,select:focus{outline:2px solid #0f5a6e;outline-offset:-1px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer}

<div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#15303a;color:#fff;padding:13px 22px;border-radius:11px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 8px 26px rgba(0,0,0,.3);animation:kfsUp .25s ease;white-space:nowrap"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDzDmby3wjTN9r7iYjWjAtL15lwzo-Av4U",
  authDomain:"kfs-cleaning.firebaseapp.com",
  projectId:"kfs-cleaning",
  storageBucket:"kfs-cleaning.firebasestorage.app",
  messagingSenderId:"258491694220",
  appId:"1:258491694220:web:0bdcb5704d9478ebb30fa9",
});
const auth           = firebase.auth();
const db             = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();
const tdoc = (p,ms=6000) => Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
let unsubCustomers = null;
let ratesSaveTimer = null;
let currentUser    = null;
let saving         = false;
let isAdmin        = false;

// ── HELPERS ───────────────────────────────────────────────────────────────
const esc    = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const el     = id => document.getElementById(id);
const money  = n => { if(isNaN(n)||n==null)return'$0'; const neg=n<0; n=Math.abs(n); const r=Math.round(n*100)/100; return(neg?'−':'')+' $'+r.toLocaleString('en-US',{minimumFractionDigits:r%1===0?0:2,maximumFractionDigits:2}); };
const money0 = n => '$'+Math.round(n||0).toLocaleString('en-US');
const initials   = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const avatarColor= n => { const cs=['#0f5a6e','#3fb6c4','#1f8a6d','#5a7d8c','#c1734d','#7d5a9c']; let h=0; for(const c of (n||'')) h=(h*31+c.charCodeAt(0))>>>0; return cs[h%cs.length]; };
const fmtDate    = iso => { try{ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){return '';} };
let _toastT;
const showToast  = msg => { const t=el('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(_toastT); _toastT=setTimeout(()=>t.style.display='none',2200); };

// ── DEFAULT RATES ─────────────────────────────────────────────────────────
function defaultRates() {
  return {
    res:{
      deep:        {label:'Deep Clean',      sub:'First / detailed clean', rate:.28, min:250,spm:5},
      standard:    {label:'Standard Clean',  sub:'Recurring maintenance',  rate:.17, min:175,spm:8},
      moveinout:   {label:'Move In / Out',   sub:'Empty home',             rate:.35, min:300,spm:4},
      construction:{label:'Construction',    sub:'Post-build cleanup',     rate:.525,min:500,spm:2.5},
    },
    discounts:{monthly:5,biweekly:15,weekly:20},
    com:{
      office:    {name:'Office',            rate:.15,sph:600},
      medical:   {name:'Medical / Clinic',  rate:.30,sph:400},
      retail:    {name:'Retail',            rate:.13,sph:700},
      restaurant:{name:'Restaurant',        rate:.22,sph:350},
      postcon:   {name:'Post-Construction', rate:.45,sph:150},
      industrial:{name:'Industrial',        rate:.15,sph:800},
    },
    comMin:{small:150,mid:275},
    resAddons:[
      {name:'Inside Oven',            price:65,type:'flag'},
      {name:'Clean Inside Fridge',    price:65,type:'flag'},
      {name:'Inside Dishwasher',      price:65,type:'flag'},
      {name:'Sink of Dishes',         price:30,type:'flag'},
      {name:'Extra Pet Hair Shed',    price:35,type:'qty',unit:'pet'},
      {name:'Wet Wipe Window Blinds', price:15,type:'qty',unit:'blind'},
      {name:'Wash & Fold Laundry',    price:35,type:'qty',unit:'load'},
      {name:'Interior Windows',       price:8, type:'qty',unit:'window'},
    ],
    comAddons:[
      {name:'Floor Waxing / Buffing',    price:.5, type:'qty',unit:'sq ft'},
      {name:'Carpet Cleaning',           price:.25,type:'qty',unit:'sq ft'},
      {name:'Window Cleaning',           price:7,  type:'qty',unit:'pane'},
      {name:'Pressure Washing',          price:.35,type:'qty',unit:'sq ft'},
      {name:'Restroom Sanitizing',       price:45, type:'qty',unit:'restroom'},
      {name:'Disinfection / Sanitizing', price:.15,type:'qty',unit:'sq ft'},
    ],
    biz:{laborHourly:25,laborPct:40,suppliesPct:8,taxPct:0},
  };
}
function mergeWithDefaults(saved) {
  const d=defaultRates(); if(!saved)return d;
  const m=JSON.parse(JSON.stringify(d));
  for(const k of ['discounts','comMin','biz'])if(saved[k])Object.assign(m[k],saved[k]);
  for(const k of ['res','com'])if(saved[k])for(const sk in m[k])if(saved[k][sk])Object.assign(m[k][sk],saved[k][sk]);
  if(Array.isArray(saved.resAddons)&&saved.resAddons.length)m.resAddons=saved.resAddons;
  if(Array.isArray(saved.comAddons)&&saved.comAddons.length)m.comAddons=saved.comAddons;
  return m;
}

// ── STATE ─────────────────────────────────────────────────────────────────
const state = {
  tab:'estimate', rates:defaultRates(), customers:[],
  mode:'residential', service:'deep', comService:'office',
  sqft:2000, freq:'onetime', cleaners:1, payMode:'hourly',
  addons:{}, comAddons:{}, activeCustId:null, saveCustId:'', authMode:'login',
};

// ── FIRESTORE HELPERS ─────────────────────────────────────────────────────
const uDoc = (...p) => db.doc(['users',currentUser.uid,...p].join('/'));
const uCol = name  => db.collection('users/'+currentUser.uid+'/'+name);

function saveRatesToFirestore() {
  if(!isAdmin)return;
  clearTimeout(ratesSaveTimer);
  ratesSaveTimer=setTimeout(async()=>{
    if(!currentUser||!isAdmin)return;
    try{
      await db.doc('config/rates').set(JSON.parse(JSON.stringify(state.rates)));
    }catch(e){
      console.error('Rates save error:',e);
      showToast('⚠ Rates not saved: '+(e.message||e.code));
    }
  },600);
}

async function persistCustomer(c) {
  if(!currentUser)throw new Error('Not logged in');
  const{id,...data}=c;
  const clean=JSON.parse(JSON.stringify(data));
  clean.updatedAt=new Date().toISOString();
  await uDoc('customers',id).set(clean);
}

async function removeCustomerFromDB(id) {
  if(!currentUser)return;
  await uDoc('customers',id).delete();
}

// ── ALLOWLIST ─────────────────────────────────────────────────────────────
async function isEmailAllowed(email) {
  try{
    const snap=await tdoc(db.doc('config/allowlist').get());
    if(!snap.exists)return true;
    const emails=(snap.data().emails||[]).map(e=>e.toLowerCase().trim());
    return emails.includes((email||'').toLowerCase().trim());
  }catch(e){ return true; } // timeout or error = allow through
}
async function saveAllowlist(emails) {
  await db.doc('config/allowlist').set({emails});
}

async function isAdminEmail(email) {
  try{
    const snap=await tdoc(db.doc('config/admins').get());
    if(!snap.exists)return false;
    const emails=(snap.data().emails||[]).map(e=>e.toLowerCase().trim());
    return emails.includes((email||'').toLowerCase().trim());
  }catch(e){ return false; }
}

// ── AUTH ──────────────────────────────────────────────────────────────────
function setAuthMode(mode) {
  state.authMode=mode;
  const tl=el('tab-login'),ts=el('tab-signup');
  tl.style.background=mode==='login'?'#fff':'transparent'; tl.style.color=mode==='login'?'#0f5a6e':'#8499a1'; tl.style.boxShadow=mode==='login'?'0 1px 3px rgba(0,0,0,.1)':'none';
  ts.style.background=mode==='signup'?'#fff':'transparent'; ts.style.color=mode==='signup'?'#0f5a6e':'#8499a1'; ts.style.boxShadow=mode==='signup'?'0 1px 3px rgba(0,0,0,.1)':'none';
  el('signup-name-wrap').style.display=mode==='signup'?'':'none';
  el('forgot-wrap').style.display=mode==='login'?'':'none';
  el('auth-btn').textContent=mode==='login'?'Log in':'Create account';
  el('auth-error').style.display='none';
  el('auth-success').style.display='none';
}

async function authSubmit() {
  const email=el('auth-email').value.trim(), pass=el('auth-pass').value, btn=el('auth-btn');
  el('auth-error').style.display='none';
  if(!email||!pass){showAuthErr('Enter your email and password.');return;}
  btn.disabled=true; btn.textContent='…';
  try {
    if(state.authMode==='login'){
      await auth.signInWithEmailAndPassword(email,pass);
    } else {
      if(pass.length<6)throw{code:'auth/weak-password'};
      const name=el('auth-name').value.trim()||email.split('@')[0];
      const cred=await auth.createUserWithEmailAndPassword(email,pass);
      await cred.user.updateProfile({displayName:name});
      try{await cred.user.sendEmailVerification();}catch(ev){console.warn('verify email error',ev);}
      showAuthSuccess('Account created! Check your email to verify your address.');
    }
  } catch(e) {
    const msgs={'auth/user-not-found':'No account with that email.','auth/wrong-password':'Wrong password.','auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'An account with this email already exists.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Enter a valid email address.','auth/network-request-failed':'Network error — check your connection.'};
    showAuthErr(msgs[e.code]||'Something went wrong. Try again.');
    btn.disabled=false; btn.textContent=state.authMode==='login'?'Log in':'Create account';
  }
}
function showAuthErr(msg){const e=el('auth-error');e.textContent=msg;e.style.display='block';el('auth-success').style.display='none';}
function showAuthSuccess(msg){const e=el('auth-success');e.textContent=msg;e.style.display='block';el('auth-error').style.display='none';}

async function forgotPassword() {
  const email=el('auth-email').value.trim();
  if(!email){el('auth-email').focus();showAuthErr('Enter your email address first.');return;}
  const btn=el('auth-btn');btn.disabled=true;
  try{
    await auth.sendPasswordResetEmail(email);
    showAuthSuccess('Password reset email sent to '+email+'. Check your inbox (and spam folder).');
  }catch(e){
    const msgs={'auth/user-not-found':'No account with that email.','auth/invalid-email':'Enter a valid email address.','auth/network-request-failed':'Network error — check your connection.'};
    showAuthErr(msgs[e.code]||'Could not send reset email. Try again.');
  }
  btn.disabled=false;
}

async function googleSignIn() {
  try{
    await auth.signInWithPopup(googleProvider);
  }catch(e){
    const msgs={'auth/popup-closed-by-user':'Sign-in cancelled.','auth/network-request-failed':'Network error — check your connection.'};
    showAuthErr(msgs[e.code]||'Google sign-in failed. Try again.');
  }
}

async function doSignOut() {
  if(unsubCustomers){unsubCustomers();unsubCustomers=null;}
  state.customers=[]; state.rates=defaultRates(); state.activeCustId=null; isAdmin=false;
  await auth.signOut();
}

// ── SCREEN ────────────────────────────────────────────────────────────────
function showScreen(name) {
  el('loading-screen').style.display=name==='loading'?'flex':'none';
  el('auth-screen').style.display   =name==='auth'   ?'flex':'none';
  el('app-screen').style.display    =name==='app'    ?'block':'none';
}

async function onLogin(user) {
  currentUser=user; showScreen('loading');
  try{
    const allowed=await tdoc(isEmailAllowed(user.email));
    if(!allowed){currentUser=null;await auth.signOut();showAuthErr('Access denied. Your email ('+user.email+') is not on the authorized list. Contact the app owner.');return;}
  }catch(e){/* timeout = allow through */}
  const [adminResult, ratesResult] = await Promise.allSettled([
    tdoc(isAdminEmail(user.email)),
    tdoc(db.doc('config/rates').get())
  ]);
  isAdmin = adminResult.status==='fulfilled' ? adminResult.value : false;
  if(ratesResult.status==='fulfilled' && ratesResult.value.exists) {
    state.rates=mergeWithDefaults(ratesResult.value.data());
  } else { state.rates=defaultRates(); }
  if(unsubCustomers)unsubCustomers();
  unsubCustomers=uCol('customers').onSnapshot(snap=>{
    state.customers=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
      const ta=b.createdAt?.seconds?b.createdAt.seconds*1000:new Date(b.createdAt||0).getTime();
      const tb=a.createdAt?.seconds?a.createdAt.seconds*1000:new Date(a.createdAt||0).getTime();
      return ta-tb;
    });
    render();
  },err=>{console.warn('Firestore listener error',err);showToast('Sync error — check Firestore rules');});
  const name=user.displayName||user.email||'';
  el('user-label').textContent=name+' · Massachusetts';
  showScreen('app'); render();
}

auth.onAuthStateChanged(user=>{ if(user)onLogin(user); else{currentUser=null;showScreen('auth');setAuthMode(state.authMode);} });

setTimeout(()=>{

// ── COMPUTE ───────────────────────────────────────────────────────────────
function compute() {
  const{mode,service,comService,sqft:rSq,freq,cleaners:rCl,payMode,addons,comAddons}=state;
  const r=state.rates, sqft=Number(rSq)||0, cleaners=Math.max(1,Number(rCl)||1);
  let base=0,hours=0,serviceLabel='',minApplied=false,freqLabel='';
  if(mode==='residential'){
    const svc=r.res[service],raw=sqft*svc.rate; minApplied=raw<svc.min;
    let p=Math.max(raw,svc.min); serviceLabel=svc.label;
    if(service==='standard'){const d=r.discounts;if(freq==='monthly'){p*=(1-d.monthly/100);freqLabel='Monthly recurring';}else if(freq==='biweekly'){p*=(1-d.biweekly/100);freqLabel='Bi-weekly recurring';}else if(freq==='weekly'){p*=(1-d.weekly/100);freqLabel='Weekly recurring';}else freqLabel='One-time';}
    base=p; hours=svc.spm>0?sqft/(svc.spm*60):0;
  }else{
    const svc=r.com[comService],raw=sqft*svc.rate,min=sqft<1500?r.comMin.small:(sqft<=3500?r.comMin.mid:r.comMin.small);
    minApplied=raw<min; base=Math.max(raw,min); serviceLabel=svc.name+' (commercial)'; hours=svc.sph>0?sqft/svc.sph:0;
  }
  const addList=mode==='residential'?r.resAddons:r.comAddons,addStore=mode==='residential'?addons:comAddons;
  let addonsTotal=0;
  const lineItems=[{label:serviceLabel+' · '+sqft.toLocaleString()+' sq ft',amt:money(base)}];
  addList.forEach(a=>{const q=Number(addStore[a.name])||0;if(q>0){const lt=a.price*q;addonsTotal+=lt;lineItems.push({label:a.name+(a.type==='qty'&&q>1?' ×'+q:''),amt:money(lt)});}});
  const subtotal=base+addonsTotal,taxPct=Number(r.biz.taxPct)||0,tax=subtotal*taxPct/100,total=subtotal+tax;
  const labor=payMode==='hourly'?hours*(Number(r.biz.laborHourly)||0):subtotal*(Number(r.biz.laborPct)||0)/100;
  const supplies=subtotal*(Number(r.biz.suppliesPct)||0)/100,netProfit=subtotal-labor-supplies;
  return{base,addonsTotal,subtotal,tax,taxPct,total,labor,supplies,netProfit,margin:subtotal>0?netProfit/subtotal:0,effHourly:hours>0?netProfit/hours:0,hours,cleaners,serviceLabel,minApplied,freqLabel,lineItems};
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────
function renderDashboard() {
  const allJobs=[];state.customers.forEach(c=>(c.jobs||[]).forEach(j=>allJobs.push({...j,customerName:c.name})));
  allJobs.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const now=new Date(),curKey=now.getFullYear()+'-'+now.getMonth();
  const mJs=allJobs.filter(j=>{const d=new Date(j.date);return d.getFullYear()+'-'+d.getMonth()===curKey;});
  const sum=(arr,f)=>arr.reduce((s,j)=>s+(Number(j[f])||0),0);
  const mR=sum(mJs,'subtotal'),mP=sum(mJs,'netProfit'),aR=sum(allJobs,'subtotal'),aP=sum(allJobs,'netProfit');
  const stats=[{label:'THIS MONTH REVENUE',val:money0(mR),sub:mJs.length+' jobs',c:'#0f5a6e'},{label:'THIS MONTH PROFIT',val:money0(mP),sub:mR>0?Math.round(mP/mR*100)+'% margin':'—',c:'#1f8a6d'},{label:'ALL-TIME REVENUE',val:money0(aR),sub:allJobs.length+' jobs',c:'#0f5a6e'},{label:'ALL-TIME PROFIT',val:money0(aP),sub:aR>0?Math.round(aP/aR*100)+'% margin':'—',c:'#1f8a6d'}].map(s=>`<div style="background:#fff;border:1px solid #dce6ea;border-radius:14px;padding:16px"><div style="font-size:11.5px;color:#8499a1;text-transform:uppercase;letter-spacing:.4px">${s.label}</div><div style="font-family:'Space Grotesk',monospace;font-weight:700;font-size:27px;color:${s.c};margin-top:3px">${s.val}</div><div style="font-size:11.5px;color:#9fb2ba">${s.sub}</div></div>`).join('');
  const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d);}
  const mAgg=months.map(d=>{const key=d.getFullYear()+'-'+d.getMonth();const js=allJobs.filter(j=>{const jd=new Date(j.date);return jd.getFullYear()+'-'+jd.getMonth()===key;});return{label:d.toLocaleDateString('en-US',{month:'short'}),rev:sum(js,'subtotal'),prof:Math.max(0,sum(js,'netProfit'))};});
  const maxR=Math.max(1,...mAgg.map(m=>m.rev));
  const bars=mAgg.map(m=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end"><div style="font-family:'Space Grotesk',monospace;font-size:10.5px;color:#7e939b;height:14px">${m.rev>0?money0(m.rev):''}</div><div style="width:100%;display:flex;gap:3px;align-items:flex-end;height:120px"><div style="flex:1;background:#0f5a6e;border-radius:4px 4px 0 0;height:${Math.round(m.rev/maxR*100)}%;min-height:${m.rev>0?2:0}px"></div><div style="flex:1;background:#3fb6c4;border-radius:4px 4px 0 0;height:${Math.round(m.prof/maxR*100)}%;min-height:${m.prof>0?2:0}px"></div></div><div style="font-size:11px;color:#8499a1">${m.label}</div></div>`).join('');
  const upcoming=state.customers.filter(c=>c.nextDue).map(c=>({c,days:Math.ceil((new Date(c.nextDue)-now)/86400000)})).sort((a,b)=>a.days-b.days).slice(0,6);
  const upHtml=upcoming.length===0?`<div style="color:#9fb2ba;font-size:13px;padding:12px 0">No recurring jobs scheduled yet.</div>`:upcoming.map(({c,days})=>{const due=days<0?'Overdue':(days===0?'Today':'In '+days+'d');const dc=days<=0?'#c14d57':(days<=3?'#c1734d':'#1f8a6d');const fr=({weekly:'Weekly',biweekly:'Bi-weekly',monthly:'Monthly'}[c.frequency])||'Recurring';return`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:#f6f9fa;border-radius:9px"><div><div style="font-weight:600;font-size:14px;color:#1b333c">${esc(c.name)}</div><div style="font-size:12px;color:#8499a1">${esc(fr)}</div></div><div style="text-align:right"><div style="font-weight:600;font-size:13px;color:${dc}">${due}</div><div style="font-family:'Space Grotesk',monospace;font-size:12px;color:#0f5a6e">${money0(c.lastRate||0)}</div></div></div>`;}).join('');
  const rjHtml=allJobs.slice(0,8).length===0?`<div style="color:#9fb2ba;font-size:13px;padding:12px 0">No saved jobs yet.</div>`:`<div><div style="display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr 1fr;gap:8px;padding:0 4px 8px;font-size:11px;color:#8499a1;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #eef3f5"><span>Customer</span><span>Service</span><span style="text-align:right">Revenue</span><span style="text-align:right">Cleaner</span><span style="text-align:right">Profit</span></div>${allJobs.slice(0,8).map(j=>`<div style="display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr 1fr;gap:8px;padding:10px 4px;border-bottom:1px solid #f2f6f7;align-items:center"><div><div style="font-weight:600;font-size:13.5px;color:#1b333c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(j.customerName)}</div><div style="font-size:11px;color:#9fb2ba">${fmtDate(j.date)}</div></div><span style="font-size:13px;color:#5e7480">${esc(j.service)}</span><span style="text-align:right;font-family:'Space Grotesk',monospace;font-size:13.5px;color:#1b333c">${money(j.subtotal)}</span><span style="text-align:right;font-family:'Space Grotesk',monospace;font-size:13.5px;color:#c14d57">${money(j.labor)}</span><span style="text-align:right;font-family:'Space Grotesk',monospace;font-size:13.5px;font-weight:600;color:#1f8a6d">${money(j.netProfit)}</span></div>`).join('')}</div>`;
  el('main').innerHTML=`<div><div style="font-family:'Sora',sans-serif;font-weight:700;font-size:24px;margin-bottom:4px">Dashboard</div><div style="font-size:13.5px;color:#7e939b;margin-bottom:18px">${now.toLocaleDateString('en-US',{month:'long',year:'numeric'})} · ${allJobs.length} jobs tracked</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:18px">${stats}</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px"><div style="flex:1 1 380px;background:#fff;border:1px solid #dce6ea;border-radius:14px;padding:18px"><div style="font-family:'Sora',sans-serif;font-weight:600;font-size:14px;margin-bottom:16px">Revenue & profit · last 6 months</div><div style="display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:14px">${bars}</div><div style="display:flex;gap:16px;margin-top:12px;font-size:12px;color:#7e939b"><span style="display:flex;align-items:center;gap:5px"><span style="width:11px;height:11px;border-radius:3px;background:#0f5a6e;display:inline-block"></span>Revenue</span><span style="display:flex;align-items:center;gap:5px"><span style="width:11px;height:11px;border-radius:3px;background:#3fb6c4;display:inline-block"></span>Net profit</span></div></div><div style="flex:1 1 300px;background:#fff;border:1px solid #dce6ea;border-radius:14px;padding:18px"><div style="font-family:'Sora',sans-serif;font-weight:600;font-size:14px;margin-bottom:12px">Upcoming recurring</div><div style="display:flex;flex-direction:column;gap:8px">${upHtml}</div></div></div><div style="background:#fff;border:1px solid #dce6ea;border-radius:14px;padding:18px"><div style="font-family:'Sora',sans-serif;font-weight:600;font-size:14px;margin-bottom:12px">Recent jobs</div>${rjHtml}</div></div>`;
}

// ── MODALS ────────────────────────────────────────────────────────────────
function openModal(type) {
  if(type==='save'){
    const q=compute();
    el('save-summary').textContent=q.serviceLabel+' · '+money(q.total)+' · profit '+money(q.netProfit);
    const sel=el('save-cust-select');
    sel.innerHTML='<option value="">— New customer —</option>'+state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    sel.value=state.saveCustId||'';
    el('save-existing-wrap').style.display=state.customers.length?'':'none';
    onSaveSelectChange();
    el('save-modal').classList.add('open');
    el('save-modal').onclick=e=>{if(e.target===el('save-modal'))closeModal('save');};
  }else if(type==='print'){
    renderPrintCard();el('print-modal').classList.add('open');
    el('print-modal').onclick=e=>{if(e.target===el('print-modal').firstElementChild?.parentElement)closeModal('print');};
  }
}
function closeModal(type){el(type+'-modal').classList.remove('open');}
function onSaveSelectChange(){const v=el('save-cust-select').value;state.saveCustId=v;el('save-new-wrap').style.display=v?'none':'';}

async function doSaveJob() {
  if(saving)return;
  // Capture all form values BEFORE closing modal
  const custName = el('sv-name').value.trim();
  const custPhone= el('sv-phone').value.trim();
  const custEmail= el('sv-email').value.trim();
  const custAddr = el('sv-addr').value.trim();
  const custNotes= el('sv-notes').value.trim();
  const isNew = !state.saveCustId;
  if(isNew && !custName){el('sv-name').focus();showToast('Enter a customer name');return;}
  saving=true;
  const btn=el('save-job-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  closeModal('save');
  try{
    const q=compute();
    const freqKey=({onetime:'one-time',monthly:'monthly',biweekly:'biweekly',weekly:'weekly'})[state.freq]||'one-time';
    const nd=computeNextDue(freqKey);
    const job={id:'j'+Date.now(),date:new Date().toISOString(),mode:state.mode,service:q.serviceLabel,freq:q.freqLabel||'',sqft:Number(state.sqft)||0,base:q.base,subtotal:q.subtotal,tax:q.tax,total:q.total,labor:q.labor,supplies:q.supplies,netProfit:q.netProfit,hours:q.hours,payMode:state.payMode};
    if(state.saveCustId){
      const cu=state.customers.find(c=>c.id===state.saveCustId);
      if(cu){cu.jobs=(cu.jobs||[]);cu.jobs.unshift(job);cu.lastService=q.serviceLabel;cu.lastRate=q.total;if(state.mode==='residential'&&state.service==='standard'){cu.frequency=freqKey;cu.nextDue=nd;}await persistCustomer(cu);}
    }else{
      const nc={id:'c'+Date.now(),name:custName,phone:custPhone,email:custEmail,address:custAddr,notes:custNotes,sqft:Number(state.sqft)||0,frequency:freqKey,nextDue:nd,lastService:q.serviceLabel,lastRate:q.total,createdAt:new Date().toISOString(),jobs:[job]};
      await persistCustomer(nc);
    }
    showToast('✓ Job saved');
  }catch(e){
    console.error('doSaveJob error:',e);
    showToast('⚠ Save failed: '+(e.message||e.code||'unknown error'));
  }finally{
    saving=false;
    if(btn){btn.disabled=false;btn.textContent='Save job';}
  }
}
function computeNextDue(k){if(k==='one-time'||!k)return null;const d=new Date();d.setDate(d.getDate()+({weekly:7,biweekly:14,monthly:30}[k]||0));return d.toISOString();}

function openDetail(id) {
  const c=state.customers.find(x=>x.id===id);if(!c)return;
  state.activeCustId=id;
  const contact=[c.phone,c.email].filter(Boolean).join(' · ')||'No contact info';
  const meta=[];
  if(c.address)meta.push({label:'Address',val:c.address});
  if(c.sqft)meta.push({label:'Size',val:c.sqft.toLocaleString()+' sq ft'});
  meta.push({label:'Frequency',val:({weekly:'Weekly',biweekly:'Bi-weekly',monthly:'Monthly'}[c.frequency])||'One-time'});
  if(c.nextDue)meta.push({label:'Next due',val:fmtDate(c.nextDue)});
  const mH=meta.map(m=>`<div style="background:#f6f9fa;border:1px solid #e4edf0;border-radius:9px;padding:7px 11px"><div style="font-size:10.5px;color:#9fb2ba;text-transform:uppercase;letter-spacing:.3px">${esc(m.label)}</div><div style="font-size:13.5px;color:#26424c;font-weight:600">${esc(m.val)}</div></div>`).join('');
  const jH=(c.jobs||[]).map(j=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f6f9fa;border-radius:9px"><div><div style="font-weight:600;font-size:14px;color:#1b333c">${esc(j.service)}</div><div style="font-size:11.5px;color:#9fb2ba">${fmtDate(j.date)} · ${(j.sqft||0).toLocaleString()} sq ft</div></div><div style="text-align:right"><div style="font-family:'Space Grotesk',monospace;font-weight:600;font-size:15px;color:#0f5a6e">${money(j.total)}</div><div style="font-size:11.5px;color:#1f8a6d">profit ${money(j.netProfit)}</div></div></div>`).join('');
  el('detail-box').innerHTML=`<div style="display:flex;align-items:flex-start;gap:13px;margin-bottom:16px"><div style="width:48px;height:48px;border-radius:13px;background:${avatarColor(c.name)};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:19px;flex-shrink:0">${initials(c.name)}</div><div style="flex:1;min-width:0"><div style="font-family:'Sora',sans-serif;font-weight:700;font-size:20px">${esc(c.name)}</div><div style="font-size:13px;color:#8499a1">${esc(contact)}</div></div><button onclick="window.closeModal('detail')" style="background:#f0f4f6;border:none;border-radius:8px;width:32px;height:32px;font-size:18px;color:#7e939b;cursor:pointer;flex-shrink:0">×</button></div>${meta.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${mH}</div>`:''}${c.notes?`<div style="background:#fffaf0;border:1px solid #f0e2c4;border-radius:9px;padding:11px 13px;font-size:13px;color:#7a6534;margin-bottom:16px">${esc(c.notes)}</div>`:''}<div style="font-family:'Sora',sans-serif;font-weight:600;font-size:13px;color:#5e7480;margin-bottom:8px">Job history</div><div style="display:flex;flex-direction:column;gap:7px;max-height:230px;overflow-y:auto">${jH||'<div style="color:#9fb2ba;font-size:13px;padding:8px 0">No jobs yet.</div>'}</div><div style="display:flex;gap:10px;margin-top:18px"><button onclick="window.deleteCustomer('${c.id}')" style="background:#fff;color:#c14d57;border:1.5px solid #e7c4c8;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer">Delete</button><button onclick="window.newQuoteFor('${c.id}')" style="flex:1;background:#0f5a6e;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer">New quote for ${esc((c.name||'').split(' ')[0])}</button></div>`;
  el('detail-modal').classList.add('open');
  el('detail-modal').onclick=e=>{if(e.target===el('detail-modal'))closeModal('detail');};
}
async function deleteCustomer(id){await removeCustomerFromDB(id);if(state.activeCustId===id)state.activeCustId=null;closeModal('detail');showToast('Customer deleted');}
function newQuoteFor(id){state.activeCustId=id;closeModal('detail');state.tab='estimate';render();const c=state.customers.find(x=>x.id===id);if(c)showToast('Quoting for '+(c.name.split(' ')[0]));openModal('save');}

function renderPrintCard() {
  const q=compute(),lnk=state.activeCustId?state.customers.find(c=>c.id===state.activeCustId):null;

  el('print-area').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0f5a6e;padding-bottom:16px;margin-bottom:22px"><div style="display:flex;align-items:center;gap:11px"><div style="width:42px;height:42px;border-radius:11px;background:#0f5a6e;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;color:#fff;font-size:16px">KFS</div><div><div style="font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:#0a3d4c">KFS CLEANING</div><div style="font-size:12px;color:#8499a1">Massachusetts · Licensed & Insured</div></div></div><div style="text-align:right"><div style="font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:#0f5a6e">ESTIMATE</div><div style="font-size:12px;color:#8499a1">${today}</div></div></div>${lnk?`<div style="margin-bottom:20px"><div style="font-size:11px;color:#9fb2ba;text-transform:uppercase;letter-spacing:.4px">Prepared for</div><div style="font-size:15px;font-weight:600;color:#1b333c">${esc(lnk.name)}</div></div>`:''}<div style="font-size:14px;color:#46606a;margin-bottom:6px">${esc(q.serviceLabel)} · ${Number(state.sqft||0).toLocaleString()} sq ft</div><table style="width:100%;border-collapse:collapse;margin-bottom:18px"><tbody>${liH}</tbody></table><div style="display:flex;justify-content:space-between;align-items:center;background:#0f5a6e;color:#fff;border-radius:11px;padding:16px 20px"><span style="font-family:'Sora',sans-serif;font-weight:600;font-size:16px">Total estimate</span><span style="font-family:'Space Grotesk',monospace;font-weight:700;font-size:26px">${money(q.total)}</span></div><div style="font-size:11.5px;color:#9fb2ba;margin-top:18px;line-height:1.5">Estimate valid 30 days. Final price may vary with on-site conditions, heavy soil, or added scope. Minimums apply. Thank you for choosing KFS Cleaning.</div>`;
}

// ── GLOBAL HANDLERS ───────────────────────────────────────────────────────
function setTab(t){state.tab=t;render();}
function setState(k,v){state[k]=v;render();}
function setRates(fn){const r=JSON.parse(JSON.stringify(state.rates));fn(r);state.rates=r;saveRatesToFirestore();render();}
function toggleAddon(store,name){const q=Number(state[store][name])||0;state[store]={...state[store],[name]:q>0?0:1};render();}
function setAddon(store,name,qty){state[store]={...state[store],[name]:Math.max(0,qty)};render();}
function onSqftSlide(v){state.sqft=v;const pct=(v/8000*100).toFixed(1);const sl=document.querySelector('input[type=range]');if(sl)sl.style.background=`linear-gradient(to right,#3fb6c4 0%,#3fb6c4 ${pct}%,#dce6ea ${pct}%,#dce6ea 100%)`;const ni=document.querySelectorAll('input[type=number]')[0];if(ni)ni.value=v;const sd=el('sqft-display');if(sd)sd.firstChild.textContent=Number(v).toLocaleString();renderPriceBar();}
function resetRates(){if(confirm('Reset all rates to defaults?')){state.rates=defaultRates();saveRatesToFirestore();showToast('Rates reset');render();}}

// ── ALLOWLIST UI ──────────────────────────────────────────────────────────
let _allowEmails = null;
async function loadAllowlistUI() {
  const wrap = el('allowlist-rows'); if(!wrap)return;
  try{
    const snap=await db.doc('config/allowlist').get();
    _allowEmails=snap.exists?(snap.data().emails||[]):[];
  }catch(e){ _allowEmails=[]; }
  renderAllowlistRows();
}
function renderAllowlistRows() {
  const wrap=el('allowlist-rows'); if(!wrap)return;
  if(!_allowEmails||_allowEmails.length===0){wrap.innerHTML='<div style="font-size:13px;color:#9fb2ba;padding:6px 0">No restrictions — any logged-in user can access.</div>';return;}
  wrap.innerHTML=_allowEmails.map((em,i)=>`<div style="display:flex;align-items:center;gap:8px;background:#f6f9fa;border:1px solid #e4edf0;border-radius:9px;padding:8px 11px"><span style="flex:1;font-size:14px;color:#26424c">${esc(em)}</span><button onclick="window.removeAllowedEmail(${i})" style="background:none;border:none;color:#c0ccd1;cursor:pointer;font-size:20px;line-height:1;padding:2px 6px">×</button></div>`).join('');
}
async function addAllowedEmail() {
  const inp=el('new-allowed-email'),email=(inp.value||'').trim().toLowerCase();
  if(!email||!email.includes('@')){showToast('Enter a valid email');return;}
  if(_allowEmails===null)_allowEmails=[];
  if(_allowEmails.includes(email)){showToast('Already in list');return;}
  _allowEmails=[..._allowEmails,email];
  inp.value='';
  try{ await saveAllowlist(_allowEmails); renderAllowlistRows(); showToast('✓ Access list updated'); }
  catch(e){ showToast('Save failed — check Firestore rules'); _allowEmails=_allowEmails.filter(e=>e!==email); }
}
async function removeAllowedEmail(i) {
  if(!confirm('Remove '+_allowEmails[i]+' from access list?'))return;
  _allowEmails=_allowEmails.filter((_,idx)=>idx!==i);
  try{ await saveAllowlist(_allowEmails); renderAllowlistRows(); showToast('✓ Removed'); }
  catch(e){ showToast('Save failed'); }
}
